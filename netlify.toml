[build]
  publish = "site"

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# The site moved from wanawun.com to wanwun.org. These only take effect while
# wanawun.com is attached to this Netlify site as a domain alias. Paths and
# query strings carry over, so https://wanawun.com/privacy.html lands on
# https://wanwun.org/privacy.html.
# QR code at community gatherings points at https://wanwun.org/join
# (WAN-49). The page lives at site/join/index.html; these send the short
# and capitalised forms straight there in one hop.
[[redirects]]
  from = "/join"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/Join"
  to = "/join/"
  status = 301

[[redirects]]
  from = "https://wanawun.com/*"
  to = "https://wanwun.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wanawun.com/*"
  to = "https://wanwun.org/:splat"
  status = 301
  force = true
