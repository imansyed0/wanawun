[build]
  publish = "site"

[build.processing]
  skip_processing = false

# Netlify Functions. submission-created.mjs runs automatically on every
# verified Netlify Forms submission and emails /join sign-ups their beta link
# over SMTP. esbuild bundles nodemailer into the function.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# The site moved from wanawun.com to wanwun.org. These only take effect while
# wanawun.com is attached to this Netlify site as a domain alias. Paths and
# query strings carry over, so https://wanawun.com/privacy.html lands on
# https://wanwun.org/privacy.html.
#
# ORDER MATTERS. Netlify stops at the first matching rule, so every old-domain
# rule has to sit above the path-only rules below. When the path rules came
# first, https://wanawun.com/join matched "/join" and was rewritten to the
# relative "/join/", which stayed on the old domain and served the page with a
# 200 instead of redirecting off it.
[[redirects]]
  from = "https://wanawun.com/*"
  to = "https://wanwun.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://wanawun.com/*"
  to = "https://wanwun.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wanawun.com/*"
  to = "https://wanwun.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.wanawun.com/*"
  to = "https://wanwun.org/:splat"
  status = 301
  force = true

# QR code at community gatherings points at https://wanwun.org/join
# (WAN-49). The page lives at site/join/index.html; these send the short
# and capitalised forms straight there in one hop.
[[redirects]]
  from = "/join"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/Join"
  to = "/join/"
  status = 301
