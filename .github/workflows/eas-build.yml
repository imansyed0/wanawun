name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    tags:
      - 'eas-build-*'
    branches:
      - 'claude/**'
    paths:
      - '.github/build-trigger/**'

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run EAS build
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'android' }}
          PROFILE: ${{ github.event.inputs.profile || 'preview' }}
          # Apple's capability sync API rejected our bundle ID during the first
          # iOS builds, and the app uses no capabilities it would enable.
          EXPO_NO_CAPABILITY_SYNC: 1
        run: |
          echo "Building platform=$PLATFORM profile=$PROFILE"

          if [ "$PLATFORM" = "all" ]; then
            PLATFORMS="android ios"
          else
            PLATFORMS="$PLATFORM"
          fi

          for p in $PLATFORMS; do
            SUBMIT=""
            # Production builds go straight to TestFlight (iOS) and the Play
            # internal testing track (Android, see submit.production in eas.json).
            # EAS schedules the submission server-side once the build finishes,
            # using the App Store Connect API key / Google service account key
            # stored in EAS credentials, so --no-wait still works.
            if [ "$PROFILE" = "production" ]; then
              SUBMIT="--auto-submit"
              if [ "$p" = "ios" ]; then
                echo "iOS production build will be submitted to TestFlight when it finishes"
              else
                echo "Android production build will be submitted to Play internal testing when it finishes"
              fi
            fi

            eas build \
              --platform "$p" \
              --profile "$PROFILE" \
              --non-interactive \
              --no-wait \
              $SUBMIT
          done
